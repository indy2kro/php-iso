name: Tests

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 6 * * *"
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, PHP ${{ matrix.php-version }})

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        php-version:
          - "8.3"
          - "8.4"
          - "8.5"

    defaults:
      run:
        shell: bash

    steps:

        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        - name: Install PHP
          uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
          with:
            php-version: "${{ matrix.php-version }}"
            coverage: "${{ matrix.os == 'ubuntu-latest' && 'pcov' || 'none' }}"

        - name: Get Composer Cache Directory 2
          id: composer-cache
          run: |
            echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

        - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          id: actions-cache
          with:
            path: ${{ steps.composer-cache.outputs.dir }}
            key: ${{ runner.os }}-composer-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
            restore-keys: |
              ${{ runner.os }}-composer-${{ matrix.php-version }}-

        - name: Cache PHP dependencies
          uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          id: vendor-cache
          with:
            path: |
              vendor
              .phpcs-cache
              .phpunit.result.cache
              .rector.cache
              .phpstan.cache
            key: ${{ runner.os }}-build-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}

        - name: Update Dependencies with latest stable
          run: composer update --no-progress

        # the static checks do not depend on the operating system: run them once per PHP version, on Linux
        - name: Validate composer.json
          if: matrix.os == 'ubuntu-latest'
          run: composer validate --strict

        - name: Audit dependencies
          if: matrix.os == 'ubuntu-latest'
          run: composer audit

        - name: Code style test
          if: matrix.os == 'ubuntu-latest'
          run: vendor/bin/phpcs

        - name: PHPStan code analysis
          if: matrix.os == 'ubuntu-latest'
          run: php vendor/bin/phpstan analyze --memory-limit=1G

        - name: Execute Rector
          if: matrix.os == 'ubuntu-latest'
          run: vendor/bin/rector --dry-run

        - name: Run tests with coverage
          if: matrix.os == 'ubuntu-latest'
          run: vendor/bin/phpunit --coverage-clover=coverage.xml --log-junit=junit.xml

        - name: Run tests
          if: matrix.os != 'ubuntu-latest'
          run: vendor/bin/phpunit --no-coverage

        - name: Smoke tests (tests/smoke/run.sh)
          run: bash tests/smoke/run.sh

        - name: Smoke tests through the Windows batch file
          if: matrix.os == 'windows-latest'
          run: ISOTOOL=bin/isotool.bat bash tests/smoke/run.sh

        - name: Upload test results to Codecov
          if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
          uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
          with:
            token: ${{ secrets.CODECOV_TOKEN }}
            report_type: test_results
            files: junit.xml

        - name: Send code coverage report to Codecov.io
          if: matrix.os == 'ubuntu-latest'
          uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
          with:
            token: ${{ secrets.CODECOV_TOKEN }}
            files: coverage.xml

  lowest-dependencies:
    name: Tests with the lowest dependencies

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"

      - name: Install the lowest supported dependencies
        run: composer update --prefer-lowest --prefer-stable --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --no-coverage
